<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POS · Quick sale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#171a2b; --ink-2:#4a5068; --ink-3:#7c8299;
  --line:#e6e8f0; --bg:#f6f7fb; --surface:#fff;
  --brand:#5436f0; --brand-d:#4125d1; --brand-t:#eeebff; --tint:#f5f3ff; --tint-line:#e6e0fb;
  --rail:#12142a;
  --price:#e8590c; --ok:#0f7a5c; --ok-t:#e3f5ee;
  --danger:#e11d48; --danger-t:#ffe9ee;
  --warn:#8a5a00; --warn-t:#fff1c9;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font:500 14px/1.4 var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:64px minmax(0,1fr) clamp(300px,36vw,360px);height:100vh;height:100dvh}

/* ---------- rail ---------- */
.rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--brand);color:#fff;text-decoration:none;
  display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:-.02em;margin-bottom:12px;flex:none}
.nav{position:relative;width:56px;padding:9px 0 7px;border-radius:14px;display:grid;justify-items:center;gap:3px;
  color:#a3a8cb;font-size:11px;font-weight:600;text-decoration:none}
.nav:hover{color:#fff}
.kb{position:absolute;top:3px;right:6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);
  color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.kb[data-n="0"]{display:none}
.rail-foot{margin-top:auto;display:grid;justify-items:center;gap:12px}
.online{display:grid;justify-items:center;gap:2px;color:#35d09a;font-size:10px;font-weight:800;letter-spacing:.05em}
.online.off{color:#ff8a9b}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--brand-t);color:var(--brand);
  display:grid;place-items:center;font-weight:800;font-size:13px;border:2px solid var(--brand)}

/* ---------- catalogue ---------- */
.catalogue{display:flex;flex-direction:column;min-width:0;min-height:0;padding:14px 18px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:42px;padding:0 18px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

.toolbar{display:flex;gap:10px;margin:12px 0 10px;flex:none}
.scan{flex:1;min-width:0;display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.scan .i{margin-left:12px;color:var(--ink-3);flex:none}
.scan input{flex:1;min-width:0;height:44px;border:0;padding:0 10px;font:inherit;font-size:16px;background:none;color:var(--ink)}
.scan input::placeholder{color:var(--ink-3)}
.scan input:focus-visible{outline:0}
.scan:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-t)}
.scan button{align-self:stretch;background:var(--brand);color:#fff;font-weight:700;padding:0 18px}
.add{flex:none;height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;white-space:nowrap}

.heading{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex:none}
.heading h2{font-size:20px;font-weight:800;letter-spacing:-.02em}
.heading span{color:var(--ink-3);font-size:14px}
.heading .station{margin-left:auto;font-size:12px;font-weight:600;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.grid{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:grid;gap:12px;align-content:start;
  padding:2px 4px 20px 2px;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));grid-auto-rows:max-content}
.empty{grid-column:1/-1;text-align:center;color:var(--ink-3);padding:40px 0}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  --tint:color-mix(in srgb,var(--fruit) 13%,#fff)}
.card.in{border-color:var(--fruit)}
.card{min-height:182px}
.card-main{display:flex;flex-direction:column;width:100%;height:100%;min-height:inherit;text-align:left}
.card-main:active{background:#fafaff}
.art{position:relative;flex:none;height:70px;display:grid;place-items:center;background:var(--tint)}
.art svg{width:30px;height:54px;color:var(--fruit)}
.glyph{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:9px;background:#fff;display:grid;place-items:center;box-shadow:0 2px 6px rgba(23,26,43,.08)}
.glyph i{width:12px;height:12px;border-radius:50%;background:var(--fruit)}
.chp{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-weight:700;font-size:12px;line-height:1.35;background:var(--bg);color:var(--ink-2)}
.chp.stock{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,#fff)}
.chp.mto,.chp.low{color:var(--warn);background:var(--warn-t)}
.chp.so{color:var(--danger);background:var(--danger-t)}
.chp.al{color:#b4400a;background:#ffe9e0}
.qty{position:absolute;top:8px;right:8px;min-width:26px;height:26px;padding:0 7px;border-radius:999px;background:var(--danger);
  color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;pointer-events:none;box-shadow:0 4px 10px -2px rgba(225,29,72,.5)}
.info{flex:1;display:flex;flex-direction:column;gap:6px;padding:10px 12px 8px}
.name{font-weight:700;font-size:15px;line-height:1.25;letter-spacing:-.005em}
.cc2{display:flex;flex-wrap:wrap;gap:4px}
.pr{margin-top:auto;display:flex;align-items:center;min-height:44px;padding-right:50px}
.price{display:block;font-size:12.5px;color:var(--ink-3);font-weight:600}
.price b{color:var(--price);font-size:17px;font-weight:800;margin:0 2px}
.minus{position:absolute;right:8px;bottom:8px;width:44px;height:44px;border-radius:50%;background:var(--danger-t);color:var(--danger);
  font-size:22px;font-weight:700;line-height:1;display:grid;place-items:center;border:1px solid #ffc9d4}

/* ---------- order panel ---------- */
.order{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;height:100%}
.sheet-head{display:none}
.order-top{display:flex;gap:6px;padding:12px 14px 0;align-items:center;flex:none}
.ctx{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.ctx::-webkit-scrollbar{display:none}
.pill{flex:none;height:38px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:10px;border:1px solid var(--line);
  font-weight:700;font-size:12.5px;white-space:nowrap;background:var(--surface);max-width:150px}
.pill span{overflow:hidden;text-overflow:ellipsis}
.pill.set{background:var(--brand-t);border-color:#d3cbff;color:var(--brand)}
.pill em{font-style:normal;min-width:20px;height:20px;border-radius:10px;background:var(--brand-t);color:var(--brand);display:grid;place-items:center;font-size:11.5px;font-weight:800}
.pill .i{width:16px;height:16px}

.modes{margin:10px 14px 0;padding:4px;border-radius:12px;background:var(--bg);display:grid;grid-template-columns:repeat(3,1fr);gap:4px;flex:none;position:relative}
.modes input{position:absolute;opacity:0;pointer-events:none}
.modes label{text-align:center;padding:10px 0;border-radius:9px;font-weight:700;color:var(--ink-3);cursor:pointer;font-size:13.5px}
.modes input:checked+label{background:var(--surface);color:var(--brand);box-shadow:0 2px 8px rgba(23,26,43,.1)}
.modes input:focus-visible+label{outline:2px solid var(--brand)}

/* status row */
.stat{display:flex;align-items:center;gap:6px;padding:8px 14px 0;min-height:40px;flex:none}
.stat .no{font-weight:800;font-size:13px;color:var(--ink-2);margin-right:2px}
.bd{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
button.bd{height:30px}
.p-unpaid{background:var(--danger-t);color:var(--danger)}
.p-partly-paid{background:#ffe8d6;color:#b4440c}
.p-paid,.s-ready{background:var(--ok-t);color:var(--ok)}
.s-ordered{background:var(--warn-t);color:var(--warn)}
.s-handed-over{background:var(--brand-t);color:var(--brand)}

.lines{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 14px;list-style:none}
.lines .none{display:grid;place-items:center;height:100%;text-align:center;color:var(--ink-3);padding:20px;font-size:14px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"nm am rm" "ac ac ac";align-items:center;
  column-gap:8px;row-gap:3px;padding:9px 0;border-bottom:1px solid var(--line)}
.line .nm{grid-area:nm;min-width:0}.line .amt{grid-area:am}.line .x{grid-area:rm}
.line .ac{grid-area:ac;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:center}
.line .ac .stepper{justify-self:end}
.line .sl{display:flex;min-height:30px;min-width:0}
.line .sl .tg{flex:1;min-width:0;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px;font-size:11.5px}
.line .t small.pu{display:block;font-size:12px;font-weight:600;color:var(--ink-3);line-height:1.2}
.line .tg.prb{color:#b4400a}
.line .fl{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.line .t{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tg{padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:800}
button.tg{min-height:28px;padding:0 11px}
.tg.o{background:var(--warn-t);color:var(--warn)}
.tg.r{background:var(--ok-t);color:var(--ok)}
.tg.h{background:#eceef3;color:#8b91a8}
.stepper{display:inline-flex;align-items:center;border-radius:999px;background:var(--bg);padding:3px}
.stepper span{min-width:26px;text-align:center;font-weight:800;font-size:15px}
.stepper button{width:34px;height:34px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(23,26,43,.18);font-size:18px;font-weight:700;line-height:1}
.amt{text-align:right;font-weight:800;font-size:14.5px}
.x{width:30px;height:30px;color:var(--ink-3);font-size:20px;line-height:1}
.x:hover{color:var(--danger)}

.foot{flex:none;border-top:1px solid var(--line);padding:10px 14px calc(12px + var(--safe-b));background:var(--surface)}
.totals{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.tax{padding:6px 11px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--bg);border:1px solid var(--line)}
.tax b{font-weight:800;color:var(--ink);font-size:14px;margin-left:3px}
.bag{margin-left:auto;display:flex;align-items:center;gap:2px;height:40px;padding:3px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.bag .plus{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 12px;border-radius:999px;font-weight:800;font-size:15px}
.bag .plus .i{width:17px;height:17px;color:var(--ink-3)}
.bag.has .plus .i{color:var(--brand)}
.bag .less{width:32px;height:32px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(23,26,43,.18);font-size:18px;font-weight:700;line-height:1}
.bag .less:disabled{opacity:.4}
.bar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:8px}
.act{height:48px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;align-content:center;gap:1px;
  font-size:10.5px;font-weight:800;letter-spacing:.03em;color:var(--ink-2);background:var(--surface)}
.act .i{width:18px;height:18px}
.act:active{background:var(--bg)}
.act:disabled{opacity:.4}
.act.cancel{color:var(--danger);border-color:#ffc9d4;background:var(--danger-t)}
.pay{width:100%;height:54px;border-radius:14px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 10px 20px -12px var(--brand);font-weight:700;font-size:15px}
.pay:active{background:var(--brand-d)}
.pay:disabled{background:#c9c5ee;box-shadow:none}
.pay.ok:disabled{background:var(--ok);box-shadow:none}
.pay small{font-size:12px;opacity:.9}
.pay strong{font-size:21px;font-weight:800;letter-spacing:-.01em}

.fab{display:none}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 18px;
  border-radius:12px;font-weight:600;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- dialogs: one size, always centred ---------- */
dialog:where([open]){position:fixed;inset:0;margin:auto}
dialog{border:0;border-radius:20px;padding:0;width:min(420px,calc(100vw - 24px));height:min(520px,calc(100dvh - 24px));
  color:var(--ink);box-shadow:0 30px 60px -20px rgba(18,20,42,.45);overflow:hidden}
dialog.payd{width:min(940px,calc(100vw - 24px));height:min(600px,calc(100dvh - 24px))}
.hos{display:flex;flex-direction:column;gap:5px}.hos .lb{font-size:12px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}.hos .seg button{height:40px;font-size:14px}.hos .m{color:var(--ink-3)}
.pzw{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(250px,1fr);gap:18px;min-height:100%}
.pzl{display:flex;flex-direction:column;gap:8px;min-width:0}
.pztop{display:flex;gap:12px;align-items:flex-end;justify-content:space-between}
.pzdue small{display:block;color:var(--ink-3);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.pzdue strong{font-size:26px;line-height:1.1;white-space:nowrap}
.pztop .fld{margin:0;flex:1;min-width:90px;max-width:150px}.pztop .fld.off{display:none}
.pzbill{display:flex;flex-direction:column;align-items:flex-end;gap:2px;max-width:150px}.pzbill small{font-size:11px;color:var(--ink-3);text-align:right;line-height:1.2}
.pzl .seg{margin-bottom:0}.pzl .seg.sale{margin-top:auto}.pzl .fld{margin-bottom:0}
.row3{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.9fr) minmax(0,1fr);gap:10px;align-items:end}.pzl .seg.sale{grid-template-columns:repeat(4,minmax(0,1fr))}.pzl #pm button{font-size:13px}
.chg2{display:flex;flex-direction:column;justify-content:center;height:46px;padding:0 4px}.chg2 span{font-size:12px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}.chg2 b{font-size:20px;color:var(--ok)}
dialog.payd .pzfoot{margin-top:auto;position:sticky;bottom:0;background:var(--surface);display:flex;flex-direction:column;gap:8px;padding-top:8px}dialog.payd .pzfoot footer{padding:0;border:0}dialog.payd .pzfoot footer .btn{flex:1}dialog.payd .pzfoot{padding-bottom:calc(10px + var(--safe-b))}dialog.payd .pzfoot footer .btn{height:auto;min-height:48px;line-height:1.2;padding:6px 10px;white-space:normal}dialog.payd .pzfoot footer .btn.primary{flex:1.6}
.pzbr{display:flex;gap:6px}.pzcu{width:44px;padding:0;display:grid;place-items:center}.pzcu .i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.dwtop{display:flex;flex-direction:column;gap:2px;padding:4px 0 10px}.dwtop small{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}.dwtop strong{font-size:30px;line-height:1.1}.dwtop span{font-size:13px;color:var(--ink-3);font-weight:600}
.dwgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:8px}.dwgrid button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);min-height:62px}.dwgrid button b{font-size:14.5px}.dwgrid button small{color:var(--ink-3);font-size:12px;line-height:1.25}
.dwl{list-style:none;margin:0;padding:0}.dwl li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}.dwl small{display:block;color:var(--ink-3);font-size:12px}.dwl .am.in{color:var(--ok)}.dwl .am.out{color:#b4440c}
.dnh{display:flex;justify-content:space-between;margin:8px 0 4px;font-weight:700;color:var(--ink-2);font-size:13px}.dnh b{color:var(--ink)}
.pzst.tap{border:0;cursor:pointer;box-shadow:0 0 0 3px rgba(224,138,0,.25);animation:pzp 1.8s ease-in-out infinite}.pzst.tap:active{transform:scale(.92)}@keyframes pzp{50%{box-shadow:0 0 0 6px rgba(224,138,0,.08)}}
.pzs{display:block;margin-left:30px!important;font-weight:600;font-size:12px;color:var(--ink-3)!important}.pzs.r{color:#b4440c!important}.pzs.d{color:var(--ok)!important}
.pzn{display:flex;align-items:center;gap:8px;min-width:0}.pzn b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pzls .pzn+small{margin-left:30px}
.pzst{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;background:#8b90a0}.pzst svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pzst.p{background:#2f6fe4}.pzst.r{background:#e08a00}.pzst.d{background:#1f9d57}.pzst.o{background:#8b90a0}
.fxb{align-self:end;justify-self:end;font-size:12.5px;font-weight:600;color:var(--ink-3);text-decoration:none;padding:0 0 10px;white-space:nowrap}.fxb:hover{text-decoration:underline}
.fxs{display:flex;flex-direction:column;gap:4px}.fxs small{font-size:12px;font-weight:700;color:var(--ink-3)}.fxs .seg button{height:36px;font-size:14px}
.pzr .hoall{margin-top:8px;height:40px}
@media (min-width:700px){dialog.payd .sb{overflow:hidden}.pzw{height:100%}.pzl{overflow:hidden}}
.pzr{border-left:1px solid var(--line);padding-left:16px;display:flex;flex-direction:column;min-height:0;min-width:0}
.pzh{display:flex;align-items:center;gap:8px;justify-content:space-between;padding-bottom:6px}.pzh span{color:var(--ink-3);font-weight:600}
.pzls{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;min-height:60px}
.pzls li{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.pzls .g small{display:block;color:#b4440c;font-weight:600;font-size:12px}.pzls .am{min-width:52px;text-align:right}

  if(it.set) return it.set.parts.some(p=>!p.pick&&stockMode(p.items[0],o)==="soldout") ? "soldout" : "ready";   // a set is sold out when a fixed dish is
  if(o.type==="cat") return on("kitchen") ? "kitchen" : "ready";   // events are cooked to order and never touch shelf stock
  if(it.mto) return on("kitchen") ? "kitchen" : "ready";
  if(!on("stock")) return "ready";
  if(stock[b]>0) return "ready";
  return on("kitchen") ? "kitchen" : "soldout";
}
const takeStock = b => { if(on("stock") && b in stock && !isMto(b)) stock[b]--; };
const giveStock = b => { if(on("stock") && b in stock && !isMto(b)) stock[b]++; };

// stock: units on the shelf. Anything added beyond stock is "made to order" and goes to the kitchen.

const stock = defaultStock();

let held=[], closed=[], bills=[], refunds=[], rlog=[], billSeq=0, refundSeq=0, returnSeq=0, view="pos";

let spare=[], spareSeq=0, picking=false, carry=null, drag=null;   // spare = kitchen-made items whose order was cancelled
// line: q = units, s = taken from stock (ready now), kr = kitchen units marked ready, d = units delivered
// payment is per order; ordered / ready / delivered is tracked per item
const fresh = outlet => ({no:null,outlet:outlet||CFG.active,type:firstMode(),lines:[],cust:null,table:null,dlv:null,bags:0,pay:[],at:Date.now()});

/* every outlet keeps its own order, held orders, bills, spare items and stock; the screens only ever see the active one */
const store = {};
const newStore = id => ({order:fresh(id),held:[],closed:[],bills:[],refunds:[],rlog:[],spare:[],stock:defaultStock()});
const ensureStores = () => CFG.outlets.forEach(o=>{ if(!store[o.id]) store[o.id]=newStore(o.id); });
function flush(){ store[CFG.active]={order,held,closed,bills,refunds,rlog,spare,stock:{...stock}}; }
function mount(id){
  const s=store[id]; order=s.order; held=s.held; closed=s.closed; bills=s.bills; refunds=s.refunds||(s.refunds=[]); rlog=s.rlog||(s.rlog=[]); spare=s.spare;

const baseOf = l => l.base||l.id;                       // menu item behind a line (a line's id is its "variant": item + note + takeaway)
const lineNote = l => [...(l.mods||[]),(l.note||"").trim()].filter(Boolean).join(" · ");
const lineLabel = l => l.n + (lineNote(l)?` (${lineNote(l)})`:"");
const isTk = (o,l) => o.type==="take" || o.type==="dlv" || (o.type==="dine" && !!l.tk);   // room and event orders are served, so they pay service charge        // takeaway order, or a takeaway item inside a dine-in order
const vkey = (base,tk,mods,note) => {
  const raw=(tk?"T":"D")+"|"+(mods||[]).slice().sort().join(",")+"|"+(note||"").trim().toLowerCase();
  if(raw==="D||") return base;                           // plain item keeps the item id
  let h=0; for(const c of raw) h=(h*31+c.charCodeAt(0))>>>0;
  return base+"~"+h.toString(36);
};
const dishKey = l => ITEMS.some(i=>i.id===baseOf(l)) ? baseOf(l) : "c:"+l.n;     // the dish itself, ignoring notes
const billKey = (o,l) => l.of ? "of:"+l.id : (l.cmp?"cmp|":"")+dishKey(l)+"|"+l.p+"|"+(isTk(o,l)?1:0);                  // what the customer's bill merges on
function groupLines(o){                                                          // [{lines:[…variants…], q}] in order of first appearance
  const m=new Map();
  o.lines.forEach(l=>{ const k=billKey(o,l); if(!m.has(k)) m.set(k,[]); m.get(k).push(l); });
  const gs=[...m.values()].map(lines=>({lines,q:lines.reduce((s,l)=>s+l.q,0)})), out=[];
  gs.filter(g=>!g.lines[0].of).forEach(g=>{ out.push(g); if(g.lines[0].set) out.push(...gs.filter(h=>h.lines[0].of===g.lines[0].id)); });   // a set's dishes sit right under it
  return out;
}
const billLines = o => groupLines(o).filter(g=>!g.lines[0].of).map(g=>({n:g.lines[0].n,b:baseOf(g.lines[0]),p:g.lines[0].p,q:g.q,tk:isTk(o,g.lines[0]),cmp:!!g.lines[0].cmp||(o.pay.length>0&&o.pay.every(p=>p.m==="comp"))}));   // "2 × Coke", no notes
const pend = l => l.q-l.s-l.kr;                       // units still being made
const prep = l => Math.min(l.kp||0,pend(l));          // …of which the kitchen has started
const probU = l => l.kr+Math.min(l.d,l.s);              // units that physically exist as a finished dish: kitchen-made, or already handed over
const kReadyU = l => Math.min(l.kr,l.s+l.kr-l.d);     // kitchen-made units waiting to be delivered
const calc = o => {
  const sub=r2(o.lines.reduce((s,l)=>s+l.p*l.q,0));
  const scBase=SC_ON_TAKEAWAY?sub:r2(o.lines.filter(l=>!isTk(o,l)).reduce((s,l)=>s+l.p*l.q,0));   // service charge only on dine-in items
  const base=r2(sub+scBase*SC), bagFee=r2((o.bags||0)*BAG_FEE);
  const fee=(o.type==="dlv"&&on("runner"))?r2(o.dlv?.fee||0):0;           // delivery fee: not taxed, no service charge
  const total=r2(base+bagFee+fee), paid=r2(o.pay.reduce((s,p)=>s+p.a,0));
  return {sub,base,bagFee,fee,total,paid,due:r2(total-paid),count:o.lines.reduce((s,l)=>s+(l.of?0:l.q),0),
    sc:r2(scBase*SC/(1+GST)), gst:r2(base*GST/(1+GST))};
};
const payState = o => {const c=calc(o);return c.paid<=0?"Unpaid":c.due>0.004?"Partly paid":"Paid";};
const readyUnits = o => o.lines.reduce((s,l)=>s+l.s+l.kr-l.d,0);   // ready but not yet delivered
const fulfil = o => !o.lines.length ? "" : o.lines.every(l=>l.d>=l.q) ? "Handed over" : o.out ? "Out for delivery" : o.lines.some(l=>pend(l)>0) ? "Ordered" : "Ready";
const release = (lines,o=order) => o.type==="cat" ? 0 : lines.forEach(l=>{ const b=baseOf(l); if(on("stock") && b in stock && !isMto(b)) stock[b]+=l.s; });
const ensureNo = () => { if(!order.no) order.no=++seq; };

/* ---------- order actions ---------- */
const closeCart = () => document.body.classList.remove("cart-open");
const needItems = () => order.lines.length ? true : (toast("Add an item first"),false);

function lineFor(l){                                      // the line a NEW unit of this dish joins: one with nothing finished yet (not kitchen-made, not delivered)
  if(l.kr===0&&l.d===0&&!l.cmp) return l;
  const b=baseOf(l), key=vkey(b,l.tk,l.mods,l.note);
  const t=order.lines.find(x=>x!==l&&!x.cmp&&x.kr===0&&x.d===0&&x.p===l.p&&x.of===l.of&&baseOf(x)===b&&vkey(b,x.tk,x.mods,x.note)===key);
  if(t) return t;
  let k=2,id; do{ id=l.id.split("~g")[0]+"~g"+(k++); }while(order.lines.some(x=>x.id===id));
  const n={id,base:b,n:l.n,p:l.p,q:0,s:0,kr:0,d:0,kp:0,t:0,u:l.u,mods:(l.mods||[]).slice(),note:l.note||"",tk:!!l.tk,...(l.of?{of:l.of,setN:l.setN,part:l.part}:{})};
  order.lines.splice(order.lines.indexOf(l)+1,0,n); return n;
}
function add(id){
  const it=ITEMS.find(i=>i.id===id), mode=stockMode(id);
  if(mode==="soldout") return toast("Sold out");
  if(it.set) return setSheet(it);
  ensureNo();
  let l=order.lines.find(x=>x.id===id);
  if(l) l=lineFor(l);                                   // units already made or delivered stay as they are; a new one starts its own line
  else { l={id,n:it.n,p:it.p,q:0,s:0,kr:0,d:0,kp:0,t:0,u:it.u,base:id,mods:[],note:"",tk:false}; order.lines.push(l); }
  const had=pend(l)>0; l.q++;
  if(mode==="ready"){ if(order.type!=="cat") takeStock(id); l.s++; } else { if(!had) l.t=Date.now(); toast(it.n+" is made to order · sent to kitchen"); }
  navigator.vibrate?.(8); render();
}
/* ---- set menus: ONE bill line (the set), plus one ordinary line per dish so each dish gets its own kitchen ticket ---- */
const itemName = id => ITEMS.find(i=>i.id===id)?.n || id;
function setSheet(it){
  const pk=it.set.parts, picks={}; pk.forEach((p,i)=>{ picks[i]=p.pick?(p.items.find(x=>stockMode(x)!=="soldout")||""):p.items[0]; });
  sheet(esc(it.n),`<p class="msg" style="padding-top:0">MVR ${money(it.p)} · one line on the bill. Each dish goes to the kitchen on its own.</p>
    ${pk.map((p,i)=>p.pick?`<div class="olg"><label>${esc(p.name)} · choose one</label>${seg(p.items.map(x=>[x,itemName(x),stockMode(x)==="soldout","Sold out"]),picks[i],"pk",{id:"sg"+i,cols:"repeat(auto-fit,minmax(110px,1fr))"})}</div>`:rr(esc(p.name),esc(itemName(p.items[0])))).join("")}`,
    [{label:"Cancel"},{label:"Add set",cls:"primary",fn:()=>{ if(addSet(it,picks)===false) return false; }}],
    d=>{ d.onclick=e=>{ const b=e.target.closest("[data-pk]"), g=b&&b.closest("[id^=sg]"); if(!b||b.disabled||!g) return;
      picks[+g.id.slice(2)]=b.dataset.pk; g.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); }; });
}
function addSet(it,picks){
  const pairs=it.set.parts.map((p,i)=>[p,picks[i]]), bad=pairs.find(([p,x])=>!x||stockMode(x)==="soldout");
  if(bad){ toast(`${bad[0].name}: choose an available dish`); return false; }
  ensureNo();
  let sl=order.lines.find(x=>x.id===it.id);
  if(!sl){ sl={id:it.id,base:it.id,n:it.n,p:it.p,q:0,s:0,kr:0,d:0,kp:0,t:0,u:"set",mods:[],note:"",tk:false,set:true}; order.lines.push(sl); }
  sl.q++; sl.s++; sl.d++;                                // the set line itself needs no kitchen or handover: its dishes carry that
  pairs.forEach(([p,x])=>{ const m=ITEMS.find(i=>i.id===x), mode=stockMode(x), cid=it.id+"|"+p.name+"|"+x;
    let l=order.lines.find(y=>y.id===cid); if(l) l=lineFor(l); else{ l={id:cid,base:x,n:m.n,p:0,q:0,s:0,kr:0,d:0,kp:0,t:0,u:m.u,mods:[],note:"",tk:false,of:it.id,setN:it.n,part:p.name}; order.lines.push(l); }
    const had=pend(l)>0; l.q++;
    if(mode==="ready"){ if(order.type!=="cat") takeStock(x); l.s++; } else if(!had) l.t=Date.now(); });
  toast(`${it.n} added`); navigator.vibrate?.(8); render();
}
function removeSet(id,after){
  const l=order.lines.find(x=>x.id===id); if(!l) return; const kids=order.lines.filter(x=>x.of===l.id);
  if(kids.some(lineStarted)) return toast("The kitchen has started this set. Send dishes back one by one with Problem");
  guardBill(order,`Remove ${l.n}${l.q>1?" ×"+l.q:""}`,()=>{ release(kids); order.lines=order.lines.filter(x=>x!==l&&x.of!==l.id); render(); after&&after(); });
}
function shiftCredit(src,dest){                         // payments follow the items: whatever the source no longer owes moves to the destination
  const c=calc(src), over=r2(c.paid-c.total);
  if(over<=0.004) return 0;
  let left=over;
  for(let i=src.pay.length-1;i>=0&&left>0.004;i--){
    const p=src.pay[i], take=Math.min(p.a,left);
    p.a=r2(p.a-take); left=r2(left-take);
    dest.pay.push({m:p.m,a:take,at:p.at,from:src.no});
  }
  src.pay=src.pay.filter(p=>p.a>0.004);
  return over;
}
function toSpare(l,kr,kp,o,why){
  spare.push({sid:"sp"+(++spareSeq),id:l.id,base:baseOf(l),mods:l.mods||[],note:l.note||"",tk:!!l.tk,n:l.n,p:l.p,u:l.u,kr,kp,q:kr+kp,ft:o.table||null,fno:o.no,t:l.t||Date.now(),why});
}
function salvage(o,why){                                   // kitchen already made / started these: keep them to sell
  let n=0;
  o.lines.forEach(l=>{ const k=kReadyU(l), p=prep(l); if(k+p>0){ toSpare(l,k,p,o,why); n+=k+p; } });
  return n;
}

function changeRaw(id,d){

    if(mode==="soldout") return toast("Sold out");
    if(mode==="ready"){ if(order.type!=="cat") takeStock(b); l.s++; }
    else { if(pend(l)===0) l.t=Date.now(); toast(l.n+" is made to order · sent to kitchen"); }
    l.q++;
  }else{
    if(pend(l)-prep(l)>0){}                                // not started: just drop it
    else if(prep(l)>0){ toSpare(l,0,1,order,"Removed"); toast("Kitchen already started it · kept as spare"); }
    else if(l.s+l.kr-l.d>0){
      if(kReadyU(l)>0){ l.kr--; toSpare(l,1,0,order,"Removed"); toast("Kitchen already made it · kept as spare"); }
      else { l.s--; if(order.type!=="cat") giveStock(b); }

}

const FAULTS=["Kitchen","Service","Customer","Supplier"];
function takeReady(l,n){                                  // take n ready or delivered units off a line; kitchen-made first for made-to-order items
  const mto=isMto(baseOf(l)); let left=n, s=0, kr=0;
  for(const k of (mto?["kr","s"]:["s","kr"])){ const t=Math.min(left,l[k]); l[k]-=t; left-=t; if(k==="kr") kr+=t; else s+=t; }
  const d=Math.min(n,l.d); l.d-=d; l.q-=n;
  return {s,kr,d};
}
function creditExcess(o,reason,l,n){                      // if the order is now overpaid, pay the difference back and link it to a bill
  const c=calc(o), excess=r2(c.paid-c.total); if(excess<=0.004) return null;
  const method=o.pay.length?o.pay[o.pay.length-1].m:"cash", bs=bills.filter(b=>b.orderNo===o.no);
  const b=[...bs].reverse().find(x=>r2(x.amount-refundedAmt(x))>=excess-0.004)||bs[bs.length-1]||null;
  const base=baseOf(l), r={no:"R"+String(++refundSeq).padStart(4,"0"),billNo:b?b.no:null,orderNo:o.no,at:Date.now(),method,amount:excess,reason,restock:false,
    lines:[{i:b?b.lines.findIndex(x=>x.b===base):-1,n:l.n,b:base,q:n,amt:excess}],fromReturn:true};
  refunds.push(r);
  reverseNonMoney(method,excess,ckey(o.cust),o.no,b?b.no:null,b?.pts,o.room?.no);
  let left=excess; for(let i=o.pay.length-1;i>=0&&left>0.004;i--){ const t=Math.min(o.pay[i].a,left); o.pay[i].a=r2(o.pay[i].a-t); left=r2(left-t); }
  o.pay=o.pay.filter(p=>p.a>0.004);
  return r;
}
function addRemake(o,l,n,rid,why){
  const b=baseOf(l), nl={id:vkey(b,l.tk,l.mods,l.note)+"~rm"+rid,base:b,n:l.n,p:l.p,q:0,s:0,kr:0,d:0,kp:0,t:Date.now(),u:l.u,mods:(l.mods||[]).slice(),note:l.note||"",tk:!!l.tk,rmk:{id:rid,why}};
  for(let k=0;k<n;k++){ const m=stockMode(b,o); if(m==="ready"){ if(o.type!=="cat") takeStock(b); nl.s++; } nl.q++; }
  return nl;
}
function applyReturn(o,l,P){
  const b=baseOf(l), n=P.n, mto=isMto(b), rid=++returnSeq, was=closed.includes(o);
  const e={no:"X"+String(rid).padStart(4,"0"),at:Date.now(),orderNo:o.no,where:whereOf(o),item:l.n,base:b,q:n,p:l.p,outcome:P.outcome,disp:P.outcome==="comp"?"kept":P.disp,
    reason:P.reason,fault:P.fault,note:P.note||"",by:ROLES[ROLE],wasted:0,restocked:0,spared:0,refund:null};
  if(P.outcome==="comp"){
    const t=takeReady(l,n);
    o.lines.push({id:vkey(b,l.tk,l.mods,l.note)+"~cp"+rid,base:b,n:l.n,p:0,q:n,s:t.s,kr:t.kr,d:t.d,kp:0,t:l.t||0,u:l.u,mods:(l.mods||[]).slice(),note:l.note||"",tk:!!l.tk,cmp:true});
  }else{

    if(np){ l.q-=np; l.kp=Math.min(l.kp||0,pend(l)); }

    if(P.disp==="stock"&&!mto&&on("stock")){ for(let k=0;k<t.s;k++) giveStock(b); rs=t.s; }
    else if(P.disp==="spare"&&t.d===0){

/* ---- returns & refunds ---- */
const refundedQ = (b,i) => refunds.filter(r=>r.billNo===b.no).reduce((s,r)=>s+(r.lines.find(x=>x.i===i)?.q||0),0);
const refundedAmt = b => r2(refunds.filter(r=>r.billNo===b.no).reduce((s,r)=>s+r.amount,0));
const REASONS=["Wrong item","Quality problem","Customer changed mind","Overcharged","Other"];
const canRefund = () => on("returns") && (ROLE==="all"||ROLE==="cashier");
function refundSheet(b,back){
  const ratio=b.sub>0?(b.sub+b.svc)/b.sub:1, left=r2(b.amount-refundedAmt(b));
  const max=b.lines.map((l,i)=>l.q-refundedQ(b,i)), sel=b.lines.map(()=>0);
  if(left<=0.004||!max.some(m=>m>0)) return toast("Nothing left to refund on this bill");
  const pm=ISMONEY(b.method)?[...new Set([b.method,...PAYM.filter(m=>CFG.pay[m[0]]&&m[0]!=="room").map(m=>m[0])])]:[b.method];
  let method=b.method;
  const total=()=>Math.min(left,r2(b.lines.reduce((s,l,i)=>s+l.p*sel[i]*ratio,0)));
  const rows=b.lines.map((l,i)=>max[i]>0?`<li data-i="${i}"><div class="g"><b>${esc(l.n)}</b><small>${money(l.p)} · up to ${max[i]}</small></div>
    ${stp("d",0)}</li>`:"").join("");
  sheet(`Refund · ${b.no}`,`<p class="bagsum">Choose what comes back. Service charge is refunded with the items. Bag levy${b.fee?" and delivery fee":""} are not.</p>
    <ul class="list" id="rfl">${rows}</ul>
    <div class="due"><span>Refund</span><strong id="ra">MVR 0.00</strong></div>
    ${seg(pm.map(m=>[m,payName(m)]),method,"m",{id:"rpm"})}
    ${SEL("rr","Reason",REASONS)}
    ${on("stock")?`<label class="chk"><input type="checkbox" id="rs" checked> <span>Return items to stock</span></label>`:""}`,
    [{label:"Back",fn:()=>{back&&back();}},{label:"Refund",cls:"primary",fn:()=>{
      const a=total(); if(a<=0.004){toast("Choose items to refund");return false;}
      const lines=b.lines.map((l,i)=>sel[i]>0?{i,n:l.n,b:l.b,q:sel[i],amt:r2(l.p*sel[i]*ratio)}:null).filter(Boolean);
      const restock=!!(on("stock")&&dlg.querySelector("#rs")?.checked);
      const r={no:"R"+String(++refundSeq).padStart(4,"0"),billNo:b.no,orderNo:b.orderNo,at:Date.now(),method,amount:a,reason:dlg.querySelector("#rr").value,restock,lines,room:b.room?{...b.room}:undefined};
      refunds.push(r); if(restock) lines.forEach(x=>{ for(let k=0;k<x.q;k++) giveStock(x.b); });
      reverseNonMoney(method,a,b.ck,b.orderNo,b.no,b.pts,b.room?.no);
      render(); refundDone(r,back); return false;}}],
    d=>{
      const ok=d.querySelector("footer .btn.primary"), sync=()=>{
        d.querySelectorAll("#rfl li").forEach(li=>{ const v=sel[+li.dataset.i]; li.querySelector("span").textContent=v; li.classList.toggle("sel",v>0); });
        d.querySelector("#ra").textContent="MVR "+money(total()); ok.disabled=total()<=0.004; };
      d.querySelector("#rfl").onclick=e=>{ const bt=e.target.closest("[data-d]"); if(!bt) return; const i=+bt.closest("li").dataset.i;
        sel[i]=Math.min(max[i],Math.max(0,sel[i]+ +bt.dataset.d)); sync(); };
      d.querySelector("#rpm").onclick=e=>{ const bt=e.target.closest("[data-m]"); if(!bt) return; method=bt.dataset.m;
        d.querySelectorAll("#rpm button").forEach(x=>x.classList.toggle("on",x===bt)); };
      sync();
    });
}
function refundDone(r,back){
  const m=rcptRefund(r);
  rcptSheet(m,"",[{label:"Share",cls:"primary",fn:()=>{rcptImage(m,true);return false;}},{label:"Done",fn:()=>{back&&back();}}]);
}

/* ---- orders list: open, pickup, deliveries, events, completed, bills ---- */
function ordersSheet(tab="open",sel=null,ty="all"){
  if(tab==="bills") return billsSheet();
  const nbag = [order,...held,...closed].reduce((s,o)=>s+(o.bags||0),0);
  const all=openOrders(), pick=all.filter(o=>o.type==="take"), dl=all.filter(o=>o.type==="dlv"||o.type==="ird"), ev=all.filter(o=>o.type==="cat");
  const openBtn = o => o===order ? "" : '<button data-o="open">Open</button>';
  const part=all.filter(o=>{ const c=calc(o); return c.paid>0.004&&c.due>0.004; });
  const tabs=[["open","Open",held.length]];
  if(on("partial")||part.length) tabs.push(["part","Part-paid",part.length]);
  if(on("pickup")&&modeOn("take")) tabs.push(["pick","Pickup",pick.filter(o=>readyUnits(o)>0).length]);
  if(on("runner")&&(modeOn("dlv")||modeOn("ird"))) tabs.push(["dlv","Deliveries",dl.length]);
  if(modeOn("cat")) tabs.push(["evt","Events",ev.length]);
  tabs.push(["done","Completed",closed.length]);
  if(on("returns")) tabs.push(["ret","Returns",rlog.length]);
  if(!tabs.some(t=>t[0]===tab)) tab="open";
  let items;
  const oi=(o,opt)=>({id:String(o.no),row:`<div class="g"><b>#${o.no} · ${esc(whereOf(o))}</b><small>${o.cust?.name?esc(o.cust.name)+" · ":""}${calc(o).count} item${calc(o).count===1?"":"s"} · ${esc(fulfil(o)||"")}</small></div><div class="ra"><b>${money(calc(o).total)}</b><span class="bd p-${key(payState(o))}">${payState(o)}</span></div>`,detail:orderCard(o,opt),t:o.type});
  const probBtn = o => on("returns")&&o.lines.some(l=>probU(l)>0) ? '<button data-o="prob">Problem</button>' : "";
  if(tab==="open") items=held.map(o=>oi(o,{acts:'<button data-o="open">Open</button>'+probBtn(o)}));
  else if(tab==="part") items=part.map(o=>{ const c=calc(o);
    return oi(o,{note:`Paid <b>${money(c.paid)}</b> of ${money(c.total)} · balance <b>${money(c.due)}</b>`,acts:(canPay()?'<button class="ok" data-o="collect">Collect</button>':"")+openBtn(o)}); });
  else if(tab==="pick") items=pick.map(o=>oi(o,{acts:(readyUnits(o)>0?`<button class="ok" data-o="hand">${SV().hand}</button>`:"")+openBtn(o)}));
  else if(tab==="dlv") items=dl.map(o=>{ const st=fulfil(o), c=calc(o);
    const note=o.type==="dlv"&&o.dlv?`${esc(o.dlv.addr)}${o.dlv.phone?" · "+esc(o.dlv.phone):""}${c.fee?" · fee "+money(c.fee):""}`:o.type==="ird"&&o.room?`${o.room.when?"Wanted at "+esc(o.room.when):"As soon as ready"}${o.room.note?" · "+esc(o.room.note):""}`:"";
    return oi(o,{note,acts:(st==="Ready"?'<button class="ok" data-o="dispatch">Dispatch</button>':st==="Out for delivery"?'<button class="ok" data-o="deliver">Delivered</button>':"")+openBtn(o)}); });
  else if(tab==="evt"){
    const prod=new Map();
    ev.filter(o=>!isQuote(o)).forEach(o=>{ const d=o.event?.date||""; if(!prod.has(d)) prod.set(d,new Map()); const m=prod.get(d); o.lines.forEach(l=>m.set(l.n,(m.get(l.n)||0)+l.q)); });
    const pl=prod.size?`<p class="bagsum">Production list · confirmed events</p>`+[...prod.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([d,m])=>
      `<div class="pl"><h4>${fmtDay(d)}</h4><ul class="rl">${[...m.entries()].sort((a,b)=>b[1]-a[1]).map(([n,q])=>`<li><span>${esc(n)}</span><b>${q}</b></li>`).join("")}</ul></div>`).join(""):"";
    items=[...(pl?[{id:"prod",row:`<div class="g"><b>Production list</b><small>Confirmed events</small></div>`,detail:pl}]:[]),...ev.slice().sort((a,b)=>(a.event?.date||"9").localeCompare(b.event?.date||"9")).map(o=>{ const c=calc(o), e=o.event||{};
      const note=`${fmtDay(e.date)}${e.time?" "+esc(e.time):""}${e.venue?" · "+esc(e.venue):""}${e.guests?" · "+e.guests+" guests":""}<br>Deposit/paid ${money(c.paid)} · balance <b>${money(Math.max(0,c.due))}</b>`;
      return oi(o,{note,acts:(isQuote(o)?'<button class="ok" data-o="confirm">Confirm</button>':"")+openBtn(o)}); })];
  }
  else if(tab==="done") items=closed.slice().reverse().map(o=>oi(o,{acts:((ROLE==="all"||ROLE==="cashier")?'<button data-o="reopen">Reopen</button>':"")+probBtn(o)}));
  else if(tab==="ret") items=rlog.slice().reverse().map(e=>({id:e.no,row:`<div class="g"><b>${e.no} · ${esc(e.item)} ×${e.q}</b><small>${esc(e.where)} · ${hhmm(e.at)}</small></div><span class="bd">${{replace:"Remade",remove:"Removed",comp:"Comped"}[e.outcome]}</span>`,detail:`<article class="oc bill"><header><b class="no">${e.no}</b><span class="wh">${esc(e.item)} ×${e.q} · ${esc(e.where)}</span><span class="age">${hhmm(e.at)}</span></header>
      <div class="cc"><span class="bd ${e.outcome==="replace"?"s-ordered":e.outcome==="comp"?"s-ready":"p-unpaid"}">${{replace:"Remade",remove:"Removed",comp:"Comped"}[e.outcome]}</span><span class="bd">${esc(e.reason)}</span><span class="bd">${esc(e.fault)}</span></div>
      <footer>${e.disp==="kept"?"Kept by the guest":[e.wasted?e.wasted+" thrown away":"",e.restocked?e.restocked+" back in stock":"",e.spared?e.spared+" kept as spare":""].filter(Boolean).join(" · ")}${e.refund?" · refund "+e.refund:""} · ${esc(e.by)}${e.note?" · “"+esc(e.note)+"”":""}</footer></article>`}));

  const empty = {open:"No other open orders.",part:"No part-paid orders. Take a smaller amount in the payment sheet to keep a bill open.",pick:"No takeaway orders waiting.",dlv:"No deliveries or room orders open.",ret:"Nothing sent back today.",evt:"No events yet. Choose Event, add details, then add dishes.",done:"Nothing completed yet today.",bills:"No bills yet. A bill is created when a payment is taken."}[tab];
  items=(items||[]).filter(x=>ty==="all"||!x.t||x.t===ty); const cur0=mdFirst(items,sel); let cur=cur0;
  const tys=ALLM.filter(modeOn);
  const top=`${seg(tabs.map(([k,n,c])=>[k,`${n} · ${c}`]),tab,"t",{id:"tabs",cols:"repeat(auto-fit,minmax(96px,1fr))"})}${tys.length>1&&tab!=="ret"?seg([["all","All types"],...tys.map(m=>[m,MODES[m]])],ty,"ty",{id:"tys",cols:"repeat(auto-fit,minmax(90px,1fr))"}):""}<p class="bagsum" style="margin:0">Plastic bags today: <b>${nbag}</b> · levy MVR ${money(nbag*BAG_FEE)}</p>`;
  sheet("Orders",mdFrame(top,items,cur,cur?`<button type="button" class="kbtn mdback">‹ Orders</button>`+items.find(x=>x.id===cur).detail:"",empty),
    [{label:"Close"}],d=>{
      dlg.classList.add("payd");
      mdBind(d,id=>{ cur=id; return `<button type="button" class="kbtn mdback">‹ Orders</button>`+items.find(x=>x.id===id).detail; });
      d.querySelector("#tabs").onclick=e=>{const b=e.target.closest("[data-t]");if(b)ordersSheet(b.dataset.t,null,ty);};
      const tyb=d.querySelector("#tys"); if(tyb) tyb.onclick=e=>{const b=e.target.closest("[data-ty]");if(b)ordersSheet(tab,cur,b.dataset.ty);};
      d.querySelector("#md").onclick=e=>{
        const op=e.target.closest("[data-o]"); if(!op) return;
        const o=[order,...held,...closed].find(x=>x.no===+op.closest(".oc").dataset.no); if(!o) return;
        const a=op.dataset.o;
        if(a==="prob") return problemPick(o,()=>ordersSheet(tab,cur,ty));
        if(a==="collect"){ if(o!==order){ openOrder(o); render(); } d.close(); return paySheet(); }
        if(a==="reopen"){ if(!closed.includes(o)) return;
          return whySheet("Reopen order",`Order #${o.no} · ${esc(whereOf(o))} comes back as an open order. This is recorded in the day-end report.`,REOPEN_WHY,"Reopen",(why,note)=>{
            closed.splice(closed.indexOf(o),1); delete o.closedAt; if(order.lines.length||order.pay.length) held.push(order); order=o;
            led("reopen",{orderNo:o.no,where:whereOf(o),why,note}); render(); toast(`Order #${o.no} reopened`); }); }
        if(a==="open"){ if(o!==order){ openOrder(o); render(); } d.close(); toast(`Order #${o.no} opened`); }
        else if(a==="dispatch") dispatchSheet(o,()=>ordersSheet(tab,cur,ty));
        else if(a==="deliver"||a==="hand"){ handover(o); ordersSheet(tab,cur,ty); }
        else if(a==="confirm"){ o.cstate="confirmed"; render(); ordersSheet(tab,cur,ty); toast(`Event #${o.no} confirmed · sent to the kitchen`); }
      };
    });
}
function transferSheet(src,all=false){
  if(!src.lines.length) return toast("Add an item first");
  const sel={}; src.lines.forEach(l=>sel[l.id]=all?l.q:0);
  const hid=l=>l.set||l.of, vis=src.lines.filter(l=>!hid(l));       // a set moves only with its whole order
  let bsel = all ? (src.bags||0) : 0;
  const any   = () => bsel>0 || src.lines.some(l=>!(l.set||l.of)&&sel[l.id]>0);
  const whole = () => bsel===(src.bags||0) && src.lines.every(l=>(l.set||l.of)?true:sel[l.id]===l.q);
  const dine  = src.type==="dine";
  const where = `#${src.no}${dine&&src.table?" · Table "+src.table:""}`;

  const step1=()=>{
    const row=(name,sub,v,attr)=>`<li ${attr}><div class="g"><b>${esc(name)}</b><small>${sub}</small></div>
      ${stp("d",v,"Move fewer","Move more")}</li>`;
    const rows = vis.map(l=>row(lineLabel(l),`${money(l.p)} · ${l.q} on this order`,sel[l.id],`data-id="${l.id}"`)).join("")
      + (src.bags?row("Plastic bags",`${src.bags} on this order`,bsel,'data-bag="1"'):"");
    sheet(all?"Move order":"Split order",
      `<p class="bagsum">${where}: choose what moves to another order.<button type="button" class="lnk" id="sa"></button></p><ul class="list" id="pick">${rows}</ul>`,
      [{label:"Cancel"},{label:"Next",cls:"primary",fn:()=>{
        const w=bsel===(src.bags||0)&&vis.every(l=>sel[l.id]===l.q); src.lines.forEach(l=>{ if(hid(l)) sel[l.id]=all&&w?l.q:0; });
        step2(); return false;}}],
      d=>{
        const next=d.querySelector("footer .btn.primary"), sa=d.querySelector("#sa");
        const sync=()=>{
          d.querySelectorAll("#pick li").forEach(li=>{
            const v=li.dataset.bag?bsel:sel[li.dataset.id];
            li.querySelector("span").textContent=v; li.classList.toggle("sel",v>0);});
          next.disabled=!any(); sa.textContent=whole()?"Clear":"Select all";
        };
        d.querySelector("#pick").onclick=e=>{
          const b=e.target.closest("[data-d]"); if(!b) return;
          const li=b.closest("li"), dd=+b.dataset.d;
          if(li.dataset.bag) bsel=Math.min(src.bags,Math.max(0,bsel+dd));
          else{const l=src.lines.find(x=>x.id===li.dataset.id); sel[l.id]=Math.min(l.q,Math.max(0,sel[l.id]+dd));}
          sync();};
        sa.onclick=()=>{const w=whole(); vis.forEach(l=>sel[l.id]=w?0:l.q); bsel=w?0:(src.bags||0); sync();};
        sync();
      });
  };

  const step2=()=>{
    const w=whole(), dests=openOrders().filter(o=>o!==src && o.type===src.type);
    const tbls=tablesNow().map(t=>t.n).filter(n=>n!==src.table);
    const def = !w ? "new" : dine ? "other" : dests[0] ? "m"+dests[0].no : "";
    const opt=(v,html)=>`<label class="opt"><input type="radio" name="dd" value="${v}" ${def===v?"checked":""}><span>${html}</span></label>`;
    let h="";
    if(!w) h+=opt("new",`<b>New order${dine&&src.table?" at Table "+src.table:""}</b><small>Paid separately</small>`);
    if(dine) h+=opt("other",`<b>${w?"Move to another table":"New order at another table"}</b><select id="tt" aria-label="Table">${tbls.map(n=>{const k=ordersAt(n).length;return `<option value="${n}">Table ${n} · ${seatsOf(n)} seats · ${k?k+" open":"free"}</option>`;}).join("")}</select>`);
    dests.forEach(o=>{const c=calc(o); h+=opt("m"+o.no,`<b>Add to order #${o.no}${o.table?" · Table "+o.table:""}</b><small>${c.count} items · MVR ${money(c.total)}</small>`);});
    sheet(w?"Move order to…":"Move items to…", h||`<p class="msg" style="text-align:center;padding-top:30px">There are no other orders to move this to.</p>`,
      [{label:"Back",fn:()=>{step1();return false;}},{label:w?"Move order":"Move items",cls:"primary",fn:()=>{
        const v=dlg.querySelector("input[name=dd]:checked")?.value;
        if(!v){toast("Choose where to move");return false;}
        const dest = v==="new" ? {kind:"new"} : v==="other" ? {kind:"table",table:+val("tt")}
                   : {kind:"merge",order:openOrders().find(o=>"m"+o.no===v)};
        doTransfer(src,sel,bsel,dest);}}],
      d=>{
        const sl=d.querySelector("#tt"); if(sl) sl.onfocus=sl.onchange=()=>{d.querySelector("input[value=other]").checked=true;};
        if(!h) d.querySelector("footer .btn.primary").disabled=true;
      });
  };
  step1();
}
/* ---- merge: pull other open orders of the same kind into this one ---- */
const mergeables = () => held.filter(o=>o.lines.length && o.type===order.type && !o.out);
function mergeSheet(){
  if(!needItems()) return;
  const list=mergeables().sort((a,b)=>((b.table===order.table&&order.table)?1:0)-((a.table===order.table&&order.table)?1:0)||a.no-b.no);
  if(!list.length) return toast("No other open "+MODES[order.type].toLowerCase()+" orders to merge");
  const sel=new Set(list.filter(o=>order.table&&o.table===order.table).length===1?list.filter(o=>o.table===order.table).map(o=>o.no):[]);
  let keep=order.table, oth=false, othT=null; const tbls=ps=>[...new Set([order,...ps].map(o=>o.table||0))].filter(Boolean).concat([order,...ps].some(o=>!o.table)?[0]:[]);
  const rows=()=>list.map(o=>{ const c=calc(o), ps=payState(o);
    return `<li data-no="${o.no}" class="${sel.has(o.no)?"sel":""}"><div class="g"><b>#${o.no} · ${esc(whereOf(o))}</b><small>${c.count} item${c.count>1?"s":""} · MVR ${money(c.total)} · ${ps}${o.table!==order.table&&order.type==="dine"?` · Table ${o.table||"–"}`:""}</small></div>
      <div class="stepper"><button type="button" data-t aria-label="${sel.has(o.no)?"Don't merge":"Merge"}" style="width:auto;padding:0 12px;border-radius:10px">${sel.has(o.no)?"✓ Merging":"Merge"}</button></div></li>`; }).join("");
  sheet("Merge orders",`<p class="bagsum">Into order #${order.no} · ${esc(whereOf(order))}. Items, kitchen progress, bags and payments come across; the other orders disappear. Receipts already printed stay as they are.</p><ul class="list" id="ml">${rows()}</ul><div id="mt" hidden></div>`,
    [{label:"Cancel"},{label:"Merge",cls:"primary",fn:()=>{
      const picked=list.filter(o=>sel.has(o.no)); if(!picked.length){toast("Choose at least one order");return false;}
      if(tbls(picked).length>1) order.table=keep;
      picked.forEach(src=>{ const cust=src.cust, rush=src.rush, w=src.billReq;
        const s2={}; src.lines.forEach(l=>s2[l.id]=l.q);
        doTransfer(src,s2,src.bags||0,{kind:"merge",order});
        if(!order.cust&&cust) order.cust=cust; if(rush) order.rush=true; });
      render(); toast(`Merged ${picked.length} order${picked.length>1?"s":""} into #${order.no}`);}}],

function acctSheet(){
  const ks=[...new Set(ledger.filter(e=>e.cust).map(e=>e.cust))];
  const rows=ks.map(k=>({k,name:custs[k]?.name||ledger.find(e=>e.cust===k&&e.name)?.name||k,bal:custBal(k),pts:custPts(k)})).filter(r=>r.bal>0.004||(on("loyalty")&&r.pts>0)).sort((a,b)=>b.bal-a.bal);
  const owed=r2(rows.reduce((s,r)=>s+Math.max(0,r.bal),0));
  sheet("Customer accounts",rows.length?`<p class="bagsum">Total owed MVR ${money(owed)}</p><ul class="list" id="al">${rows.map(r=>`<li data-k="${esc(r.k)}"><div class="g"><b>${esc(r.name)}</b><small>${r.bal>0.004?"Owes MVR "+money(r.bal):"Account clear"}${on("loyalty")?" · "+r.pts+" points":""}</small></div>${r.bal>0.004?'<div class="stepper"><button type="button" data-t style="width:auto;padding:0 12px;border-radius:10px">Collect</button></div>':""}</li>`).join("")}</ul>`:`<p class="msg">Nobody owes anything and nobody has points yet.</p>`,
    [{label:"Close",cls:"primary"}],
    d=>{ const l=d.querySelector("#al"); if(l) l.onclick=e=>{ const li=e.target.closest("[data-k]"); if(li&&e.target.closest("[data-t]")) settleSheet(li.dataset.k); }; });
}
const owingBills = k => {                                  // charges to the account, oldest first, after earlier payments have been used up
  let pool=ledger.filter(e=>e.cust===k&&(e.type==="credit-paid"||e.type==="credit-adj")).reduce((t,e)=>t+e.a,0);
  return ledger.filter(e=>e.cust===k&&e.type==="credit").map(e=>{ const take=Math.min(pool,e.a); pool=r2(pool-take); return {no:e.orderNo,label:e.orderNo?"Bill #"+e.orderNo:"Account charge",left:r2(e.a-take)}; }).filter(x=>x.left>0.004);
};
const allocate = (bs,amt) => { let rest=amt; return bs.map(b=>{ const pay=r2(Math.min(rest,b.left)); rest=r2(rest-pay); return {...b,pay,after:r2(b.left-pay)}; }).filter(x=>x.pay>0.004); };
function settleSheet(k,back=acctSheet){
  const nm=custs[k]?.name||k, bal=custBal(k), pm=PAYM.filter(m=>CFG.pay[m[0]]&&m[0]!=="room").map(m=>m[0]); let method=pm[0]||"cash";
  const bs=owingBills(k);
  const plan=a=>{ const al=allocate(bs,a), rem=r2(bal-a);
    return al.map(x=>rr(`${x.label}`,x.after<=0.004?`− ${money(x.pay)} · cleared`:`− ${money(x.pay)} · ${money(x.after)} left`,x.after<=0.004?"g":"m")).join("")+rr("Still owed after this",`MVR ${money(Math.max(0,rem))}`,rem>0.004?"t":"g"); };
  sheet(`Collect from ${nm}`,`<div class="due"><span>Owes</span><strong>MVR ${money(bal)}</strong></div>
    ${F("sa",`Amount received (MVR)`,`inputmode="decimal" value="${bal.toFixed(2)}"`)}
    ${seg(pm.map(m=>[m,payName(m)]),method,"m",{id:"sm",cols:"repeat(auto-fit,minmax(90px,1fr))"})}
    <p class="shh">Goes to the oldest bills first</p><div id="al">${plan(bal)}</div>`,
    [{label:"Back",fn:()=>{back();return false;}},{label:"Collect",cls:"primary",fn:()=>{
      const a=r2(parseFloat(val("sa")));
      if(!(a>0)||a>bal+0.004){toast("Enter a valid amount");return false;}
      const al=allocate(bs,a);
      led("credit-paid",{cust:k,name:nm,a,m:method,alloc:al.map(x=>({orderNo:x.no,a:x.pay}))});
      if(on("loyalty")&&enrolled(k)){ const pt=earnPts(a); if(pt>0) led("earn",{cust:k,name:nm,pts:pt,a,note:"account payment"}); }
      render();
      sheet("Payment received",`<p class="msg" style="padding-top:0"><b>MVR ${money(a)}</b> from ${esc(nm)} · ${esc(payName(method))}</p>${plan(a)}`,[{label:"Done",cls:"primary",fn:()=>{back();return false;}}]);
      return false;}}],
    d=>{ d.querySelector("#sm").onclick=e=>{const b=e.target.closest("[data-m]"); if(!b) return; method=b.dataset.m; d.querySelectorAll("#sm button").forEach(x=>x.classList.toggle("on",x===b)); };
      const sa=d.querySelector("#sa"); sa.oninput=()=>{ const a=r2(parseFloat(sa.value)); d.querySelector("#al").innerHTML=a>0&&a<=bal+0.004?plan(a):`<p class="hint2">Enter an amount up to MVR ${money(bal)}.</p>`; }; });
}

const ROOMT=["room-charge","room-paid","room-adj"];
const roomBal = no => r2(ledger.filter(e=>e.room===no).reduce((s,e)=>s+(e.type==="room-charge"?e.a:(e.type==="room-paid"||e.type==="room-adj")?-e.a:0),0));

function folioSheet(no){

function folioSettle(no){                                  // the guest pays the folio at the POS (the other way is to leave it for the room system)

    [{label:"Back",fn:()=>{folioSheet(no);return false;}},{label:"Collect",cls:"primary",fn:()=>{

/* ---- list on the left, detail on the right: Bills, Orders and Customers all use this ---- */
function mdFrame(top,rows,sel,detail,empty){
  return `<div class="mdw">${top}<div class="msplit" id="ms"><ul class="ml" id="ml">${rows.length?rows.map(r=>`<li data-id="${esc(r.id)}" class="${r.id===sel?"on":""}">${r.row}</li>`).join(""):`<li class="none">${empty}</li>`}</ul><div class="md" id="md">${detail}</div></div></div>`;
}
function mdBind(d,get,onPick){                              // tapping a row fills the right column; on a phone the detail replaces the list
  const ms=d.querySelector("#ms"), ml=d.querySelector("#ml"), md=d.querySelector("#md");
  ml.onclick=e=>{ const li=e.target.closest("li[data-id]"); if(!li) return; ml.querySelectorAll("li").forEach(x=>x.classList.toggle("on",x===li)); md.innerHTML=get(li.dataset.id); md.scrollTop=0; ms.classList.add("show"); onPick&&onPick(li.dataset.id); };
  md.addEventListener("click",e=>{ if(e.target.closest(".mdback")) ms.classList.remove("show"); });
}
const mdFirst = (rows,sel) => rows.some(r=>r.id===sel)?sel:(rows[0]?.id||null);

function billsSheet(f="all",sel=null,q=""){

    if(o.k==="r"){ cx.strokeStyle="#9aa0a8"; cx.setLineDash([5,4]); cx.beginPath(); cx.moveTo(P,mid); cx.lineTo(W-P,mid); cx.stroke(); }

function zoneSheet(zone){

  if(!src.length) return toast(`No open orders in ${zone}`);

  const plan=()=>{                                       // best free table: enough seats first, then closest size
    const used=new Set(); map={};
    src.forEach(t=>{
      const pick=free().filter(f=>!used.has(f.n)).sort((a,b)=>(a.seats>=t.seats?0:1)-(b.seats>=t.seats?0:1)||Math.abs(a.seats-t.seats)-Math.abs(b.seats-t.seats)||a.n-b.n)[0];

    <div class="fld"><label for="zd">Move to</label><select id="zd" class="sel">${`<option value="all">All other areas</option>`+zones.map(z=>`<option value="${esc(z)}">${esc(z)}</option>`).join("")}</select></div>
    <ul class="list" id="zl">${rows()}</ul><p class="brk" style="margin-top:8px">⚠ means the new table has fewer seats.</p>`,
    [{label:"Cancel"},{label:"Move tables",cls:"primary",fn:()=>{

function destOrderFor(table,src){

function commitDest(dest,isNew){ if(isNew){ dest.no=++seq; held.push(dest); } }
/* how many units of a line can move, per state */
const availUnits = (l,only,max) => {
  const a={ready:l.s+l.kr-l.d, prep:prep(l), ordered:pend(l)-prep(l), done:l.d};
  if(only){ Object.keys(a).forEach(k=>{ if(k!==only) a[k]=0; }); if(max) a[only]=Math.min(a[only],max); }
  return a;
};
const UNIT_LABEL = {ready:"Ready",prep:"Preparing",ordered:"Ordered",done:"Delivered"};
const UNIT_CLS   = {ready:"r",prep:"pp",ordered:"o",done:"h"};
function takeUnits(l,c){                                 // remove units of a line by state; returns what was taken
  const ds=Math.min(l.d,l.s), dk=l.d-ds, su=l.s-ds, ku=l.kr-dk;       // delivered units are taken from stock units first
  const nr=Math.min(c.ready||0,su+ku), np=Math.min(c.prep||0,prep(l)), no=Math.min(c.ordered||0,pend(l)-prep(l)), nd=Math.min(c.done||0,l.d);
  const mKr=Math.min(nr,ku), mSd=Math.min(nd,ds);                    // ready: kitchen-made units go first
  const u={n:nr+np+no+nd, mS:(nr-mKr)+mSd, mK:mKr+(nd-mSd), mP:np, mD:nd};
  if(u.n>0){ l.q-=u.n; l.s-=u.mS; l.kr-=u.mK; l.d-=u.mD; l.kp=Math.min(Math.max(0,(l.kp||0)-u.mP),pend(l)); }
  return u;
}
function putUnits(dest,l,u){                             // add units to the matching variant line of an order
  let t=dest.lines.find(x=>x.id===l.id);
  if(!t){ t={id:l.id,base:baseOf(l),n:l.n,p:l.p,u:l.u,note:l.note||"",mods:(l.mods||[]).slice(),tk:!!l.tk,q:0,s:0,kr:0,d:0,kp:0,t:l.t,rmk:l.rmk,cmp:l.cmp}; dest.lines.push(t); }
  t.q+=u.n; t.s+=u.mS; t.kr+=u.mK; t.d+=u.mD; t.kp+=u.mP; t.t=Math.min(t.t||l.t||Infinity,l.t||t.t||Infinity); if(!isFinite(t.t)) t.t=0;
  return t;
}
/* the one move routine: units leave `src` and join `to.dest`. Dialog (doTransfer) and drag (performMove) both end here. */
function moveUnits(src,picks,bags,to){
  const {dest,isNew}=to; let n=0, late=false;

/* drag an item chip onto a table. A short tap just "picks it up" so you can tap a table instead (touch friendly). */
const tableAt = (x,y) => document.elementFromPoint(x,y)?.closest?.("[data-tb]");
document.addEventListener("pointerdown",e=>{
  const chip=e.target.closest("[data-drag]"); if(!chip||e.target.closest("[data-sdel]")) return;
  drag={chip,p:JSON.parse(chip.dataset.drag),x:e.clientX,y:e.clientY,on:false,ghost:null,id:e.pointerId};
  chip.setPointerCapture?.(e.pointerId);
});
addEventListener("pointermove",e=>{
  if(!drag||e.pointerId!==drag.id) return;
  if(!drag.on){
    if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8) return;
    drag.on=true; drag.ghost=document.createElement("div");
    drag.ghost.className="ghost "+(drag.chip.classList.contains("it")?[...drag.chip.classList].filter(c=>c==="it"||c.startsWith("u-")).join(" "):"gh");
    drag.ghost.textContent=drag.chip.dataset.label||drag.chip.textContent.trim().replace(/\s+/g," ");
    document.body.appendChild(drag.ghost); drag.chip.classList.add("dragging");
  }
  drag.ghost.style.left=e.clientX+"px"; drag.ghost.style.top=e.clientY+"px";
  document.querySelectorAll(".tb.drop").forEach(t=>t.classList.remove("drop"));
  tableAt(e.clientX,e.clientY)?.classList.add("drop");
});
addEventListener("pointerup",e=>{
  if(!drag||e.pointerId!==drag.id) return;
  const d=drag; drag=null;
  if(d.on){
    d.ghost.remove(); d.chip.classList.remove("dragging");
    document.querySelectorAll(".tb.drop").forEach(t=>t.classList.remove("drop"));
    const t=tableAt(e.clientX,e.clientY);
    if(t) dropOn(d.p,+t.dataset.tb); else { renderCart(); renderTables(); }
  }else{                                                            // tap: pick up / put down
    carry = sameCarry(carry,d.p) ? null : d.p; renderCart(); renderTables();
  }
});
addEventListener("pointercancel",()=>{ if(!drag) return; if(drag.ghost) drag.ghost.remove(); drag=null; if(view==="tables") renderTables(); });

const DK={
  float:{n:"Cash in / float",d:"Opening float or a top-up",dir:"in",cats:["Opening float","Top-up","Change from the bank","Other"]},
  petty:{n:"Petty cash",d:"Small purchases paid from the drawer",dir:"out",cats:["Supplies","Transport","Cleaning","Staff meal","Repairs","Other"],payee:"Paid to (optional)"},

function drawerTotals(sh=(shiftOn()?curShift():null)){        // cash that should be in the drawer: this shift's window, or today when no shift is open
  const inw=sh?(x=>x>=sh.start&&(!sh.end||x<=sh.end)):isToday, open=sh?sh.open.count:0;
  const mine=ledger.filter(e=>e.type==="drawer"&&e.outlet===CFG.active&&inw(e.at));
  let sales=0; const fx={};
  bills.filter(b=>b.method==="cash"&&inw(b.at)).forEach(b=>{ if(b.cur&&b.cur!=="MVR"){ fx[b.cur]=r2((fx[b.cur]||0)+(b.tendered||0)); sales-=r2((b.tendered||0)*(b.fx||1)-b.amount); } else sales+=b.amount; });
  const acct=r2(ledger.filter(e=>(e.type==="credit-paid"||e.type==="room-paid")&&e.m==="cash"&&e.outlet===CFG.active&&inw(e.at)).reduce((s,e)=>s+e.a,0));
  const ref=r2(refunds.filter(r=>r.method==="cash"&&inw(r.at)).reduce((s,r)=>s+r.amount,0));
  const ins=r2(mine.filter(e=>e.dir==="in").reduce((s,e)=>s+e.a,0)), outs=r2(mine.filter(e=>e.dir==="out").reduce((s,e)=>s+e.a,0));
  return {mine,open,sales:r2(sales),acct,ref,ins,outs,fx,expected:r2(open+sales+acct-ref+ins-outs)};
}

function shiftSnap(sh){

}

function shiftModel(sh){

    ${cr.length?rr(`On account · ${cr.length}`,"MVR "+money(r2(sum(cr)-crAdj)),"m"):""}${pt.length?rr(`Paid with points · ${pt.length}`,"MVR "+money(sum(pt)),"m"):""}
    ${SALES.slice(1).map(([id,n])=>{const x=cm.filter(e=>e.cls===id);return x.length?rr(`${n} · ${x.length}`,"MVR "+money(sum(x)),"m"):""}).join("")}
    ${cm.length?cm.map(e=>`<p class="brk">#${e.orderNo} · ${SALENAME[e.cls]} · MVR ${money(e.a)} · ${esc(e.why||"")} — “${esc(e.note)}” <small>${esc(e.by)}</small></p>`).join(""):""}
    ${(part.length||owed>0.004)?h("Still to collect"):""}
    ${part.length?rr(`Open bills part-paid · ${part.length}`,"MVR "+money(r2(part.reduce((s,o)=>s+calc(o).due,0))),"m"):""}${owed>0.004?rr("Customers owing, all time","MVR "+money(owed),"m"):""}
    ${(ud.length||ro.length||bc.length)?h("Corrections")+bc.map(e=>`<p class="brk">Printed bill changed · #${e.orderNo} · ${esc(e.what)} — “${esc(e.note)}” · ${esc(e.appr)} <small>${esc(e.by)}</small></p>`).join("")+ud.map(e=>`<p class="brk">Delivery reversed · #${e.orderNo} · ${esc(e.item)}${e.q>1?" ×"+e.q:""} · ${esc(e.why)}${e.note?" — “"+esc(e.note)+"”":""} <small>${esc(e.by)}</small></p>`).join("")+ro.map(e=>`<p class="brk">Reopened · #${e.orderNo} · ${esc(e.why)}${e.note?" — “"+esc(e.note)+"”":""} <small>${esc(e.by)}</small></p>`).join(""):""}
    ${on("loyalty")?h("Loyalty")+rr("Points earned",er.reduce((s,e)=>s+e.pts,0)+" pts","m")+rr("Points redeemed",pt.reduce((s,e)=>s+e.pts,0)+" pts","m"):""}
    ${on("returns")?h("Sent back")+rr("Sent back",rlog.length+" · "+rlog.filter(x=>x.outcome==="replace").length+" remade")+rr("Thrown away",rlog.reduce((s,x)=>s+x.wasted,0)+" items · MVR "+money(rlog.reduce((s,x)=>s+x.wasted*x.p,0)),"m"):""}
    ${shiftOn()?shiftBlock():""}
    ${dwHtml}
    ${h("Orders")}${rr("Open orders",openOrders().length)}${rr("Completed orders",closed.length)}
    <p class="brk">Closing a shift and cash counting belong to the backend. This is the live summary.</p>`,
    [...((on("credit")||on("loyalty"))?[{label:"Accounts",fn:()=>{acctSheet();return false;}}]:[]),...(on("saleTypes")?[{label:"Marketing & mgmt",fn:()=>{expenseSheet();return false;}}]:[]),...(shiftOn()&&curShift()?[{label:"End shift",fn:()=>{endFlow();return false;}}]:[]),{label:"Close",cls:"primary"}],
    d=>{ d.querySelectorAll("[data-sc]").forEach(b=>b.onclick=()=>{ const a=b.dataset.sc;
        if(a==="on"){ CFG.on.drawer=true; CFG.on.shifts=true; commitCfg(); dlg.close(); startFlow(); }
        else if(a==="start") startFlow(); else if(a==="lock") lockFlow(); else if(a==="switch") switchFlow(); else if(a==="end") endFlow(); });
      const l=d.querySelector("#shl"); if(l) l.onclick=e=>{ const li=e.target.closest("[data-sh]"); const x=li&&shifts.find(y=>y.id===li.dataset.sh); if(x) showShiftReport(x,shiftSheet); }; });
}
$("#shiftBtn").onclick=shiftSheet;
$("#drawerBtn").onclick=drawerSheet; $("#custBtn").onclick=()=>custPage(); $("#roomsBtn").onclick=()=>roomsPage();
$("#billsBtn").onclick=()=>billsSheet();
const net=()=>{const on=navigator.onLine;$("#net").classList.toggle("off",!on);$("#netl").textContent=on?"ONLINE":"OFFLINE";};
addEventListener("online",net); addEventListener("offline",net);

const commitCfg = () => { saveCfg(); applyConfig(); render(); };
$("#setBody").addEventListener("click",e=>{
  const ma=e.target.closest("[data-menuadm]"); if(ma) return ({groups:groupsAdmin,allergens:allergenAdmin,items:itemsAdmin,reasons:reasonAdmin,rooms:roomAdmin,stations:stationAdmin,breaks:breakAdmin,staff:staffAdmin})[ma.dataset.menuadm]();
  if(e.target.closest("[data-up]")) return planSheet();
  const p=e.target.closest("[data-preset]");
  if(p){ const id=p.dataset.preset;
    return sheet(`Switch to ${PRESETS[id].name}?`,`<p class="msg">${esc(PRESETS[id].desc)}<br><br>This resets the switches, outlets and the demo orders.</p>`,
      [{label:"Cancel"},{label:"Switch",cls:"primary",fn:()=>applyPreset(id)}],null,true); }
  if(e.target.closest("[data-oadd]")){
    const n=CFG.outlets.length+1; CFG.outlets.push({id:"o"+Date.now().toString(36),name:"Outlet "+n,modes:["take"],zones:[],cats:null}); ensureStores(); return commitCfg(); }
  if(e.target.closest("[data-reset]")){
    return sheet("Reset orders?",`<p class="msg">Clears every outlet’s orders, bills and stock${CFG.demo?" and reloads the demo orders":""}. Your settings stay.</p>`,
      [{label:"Cancel"},{label:"Reset",cls:"danger",fn:()=>{ const keep=CFG; Object.keys(store).forEach(k=>delete store[k]); seq=0;custom=0;billSeq=0;refundSeq=0; returnSeq=0;spareSeq=0; ledger=[];ledSeq=0;custs={};shifts=[]; ensureStores(); mount(CFG.active); if(keep.demo) seed(); commitCfg(); toast("Orders reset"); }}],null,true); }
  const del=e.target.closest("[data-odel]");
  if(del){ const id=del.closest("[data-oid]").dataset.oid; flush(); const t=store[id];
    if(t&&(t.held.length||t.order.lines.length)) return toast("Close or move that outlet’s open orders first");
    CFG.outlets=CFG.outlets.filter(o=>o.id!==id); delete store[id];
    if(CFG.active===id){ CFG.active=CFG.outlets[0].id; ensureStores(); mount(CFG.active); } return commitCfg(); }
});
$("#setBody").addEventListener("change",e=>{
  const t=e.target, oid=t.closest("[data-oid]")?.dataset.oid, o=CFG.outlets.find(x=>x.id===oid);
  if(t.dataset.f!==undefined){
    const id=t.dataset.f;
    if(t.checked){ const r=onCascade(CFG.on,id); CFG.on=r.m; if(r.added.length) toast("Also turned on: "+r.added.map(fname).join(", ")); }
    else{
      const gone=offCascade(CFG.on,id);
      if(gone.length){ t.checked=true;
        return sheet(`Turn off ${esc(fname(id))}?`,`<p class="msg">These need it, so they will be turned off too:<br><br><b>${gone.map(g=>esc(fname(g))).join("<br>")}</b></p>`,
          [{label:"Keep it on"},{label:"Turn them off",cls:"primary",fn:()=>{ CFG.on[id]=false; gone.forEach(g=>CFG.on[g]=false); commitCfg(); }}],null,true); }
      CFG.on[id]=false; }
  }
  else if(t.dataset.n!==undefined) CFG.num[t.dataset.n]=Math.max(0,parseFloat(t.value)||0);
  else if(t.dataset.fx!==undefined) CFG.fx[t.dataset.fx]=Math.max(0,parseFloat(t.value)||0);
  else if(t.dataset.bl!==undefined) CFG.billLock=t.value;
  else if(t.dataset.sh!==undefined){ const k=t.dataset.sh; CFG.shift[k]=t.type==="checkbox"?t.checked:(k==="mode"?t.value:Math.max(0,parseFloat(t.value)||0)); }
  else if(t.dataset.sa!==undefined) CFG.saleAppr[t.dataset.sa]=t.checked;
  else if(t.dataset.cs!==undefined) CFG.catStation[t.dataset.cs]=t.value;
  else if(t.dataset.ra!==undefined) CFG.removeAsk=t.value;
  else if(t.dataset.rc!==undefined) CFG.rcpt[t.dataset.rc]=t.dataset.rc==="cc"?t.value.replace(/\D/g,"")||"960":t.value.trim();
  else if(t.dataset.rcp!==undefined) CFG.rcpt.print=t.checked;
  else if(t.dataset.pin!==undefined) CFG.pin=String(t.value).trim()||CFG.pin;
  else if(t.dataset.sctk!==undefined) CFG.scTk=t.checked;
  else if(t.dataset.p!==undefined){ CFG.pay[t.dataset.p]=t.checked; if(!Object.values(CFG.pay).some(Boolean)){ CFG.pay.cash=true; toast("At least one payment method is needed"); } }
  else if(o&&t.dataset.on!==undefined) o.name=t.value.trim()||o.name;
  else if(o&&t.dataset.om!==undefined){ o.modes=ALLM.filter(m=>m===t.dataset.om?t.checked:o.modes.includes(m)); if(!o.modes.length){ o.modes=[t.dataset.om]; toast("An outlet needs at least one service mode"); } }
  else if(o&&t.dataset.oz!==undefined){ const z=new Set(o.zones||[]); t.checked?z.add(t.dataset.oz):z.delete(t.dataset.oz); o.zones=[...z]; }
  else if(o&&t.dataset.oc!==undefined){ const all=[...new Set(ITEMS.map(i=>i.c))], cur=new Set(o.cats||all); t.checked?cur.add(t.dataset.oc):cur.delete(t.dataset.oc);
    if(!cur.size){ cur.add(t.dataset.oc); toast("An outlet needs at least one menu category"); } o.cats=cur.size===all.length?null:all.filter(c=>cur.has(c)); }
  else return;
  CFG.preset=PRESETS[CFG.preset]&&JSON.stringify(CFG.on)===JSON.stringify(PRESETS[CFG.preset].on)?CFG.preset:CFG.preset;
  commitCfg();
});
$("#outletBtn").onclick=outletSheet;

if(!load()){ ensureStores(); mount(CFG.active); if(CFG.demo) seed(); }
applyConfig(); renderChips(); net(); render();
setInterval(()=>{ if(drag) return; if(view==="kds") renderKds(); else if(view==="tables") renderTables(); },20000);   // keep timers fresh
</script>
</body>
</html>
